[OBS]
obs_pwd= #OBS password. You can find it in OBS app
obs_port=4455 #OBS port. Nothing means default which is 4455.
obs_app_path= #Nothing means default which is C:\Program Files\obs-studio\bin\64bit
obs_output_path= #Nothing means default which is your user videos folder

[MoTeC]
motec_path= #Where your MoTeC expecting videos. Nothing means default which is C:/MoTeC/Videos

[Script]
loop_delay=1 #Delay in script loop in seconds. Can reduce CPU load. Recomended: 0.1
logging=1 #Which messages script will be printing and logging. 0 - no logging, 1 - just error logging, 2 - errors and prints logging, 3 - errors, prints and cycle logging